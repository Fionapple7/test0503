<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花屋のホームページ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #8bc34a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #4caf50;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        section {
            padding: 20px;
        }
        footer {
            background-color: #8bc34a;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            width: calc(33.333% - 20px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .product img {
            max-width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>花屋「フローラルガーデン」</h1>
        <p>新鮮で美しい花々をお届けします</p>
    </header>
    <nav>
        <a href="#about">私たちについて</a>
        <a href="#products">商品一覧</a>
        <a href="#contact">お問い合わせ</a>
    </nav>
    <section id="about">
        <h2>私たちについて</h2>
        <p>「フローラルガーデン」は、地元で愛される花屋です。季節の花々や特別なイベント用のアレンジメントを提供しています。</p>
    </section>
    <section id="products">
        <h2>商品一覧</h2>
        <div class="products">
            <div class="product">
                <img src="flower1.jpg" alt="バラのブーケ">
                <h3>バラのブーケ</h3>
                <p>価格: ¥3,000</p>
            </div>
            <div class="product">
                <img src="flower2.jpg" alt="チューリップのアレンジメント">
                <h3>チューリップのアレンジメント</h3>
                <p>価格: ¥2,500</p>
            </div>
            <div class="product">
                <img src="flower3.jpg" alt="季節の花束">
                <h3>季節の花束</h3>
                <p>価格: ¥4,000</p>
            </div>
        </div>
    </section>
    <section id="contact">
        <h2>お問い合わせ</h2>
        <form action="#" method="post">
            <label for="name">お名前:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">メールアドレス:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="message">メッセージ:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br><br>
            <button type="submit">送信</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2025 花屋「フローラルガーデン」</p>
    </footer>
</body>
</html>
